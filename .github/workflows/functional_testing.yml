name: Functional Testing

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: "functional"
  cancel-in-progress: false

jobs:
  test-minimum:
    name: Python 3.12 - minimum dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Set up Python
        run: uv python install 3.12
      - name: Install with minimum dependencies
        run: uv sync --extra test --resolution lowest-direct --python 3.12
      - name: Run tests
        run: uv run pytest tests/src -n0

  test-latest:
    name: Python 3.14 - latest dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Set up Python 3.14
        run: uv python install 3.14
      - name: Install with latest dependencies
        run: uv sync --extra test --python 3.14
      - name: Run tests with coverage
        run: uv run pytest tests/src -n0 --cov=src --cov-report=xml:coverage/coverage.xml --cov-report=html:coverage/htmlcov --cov-append
      - name: Create coverage badge
        run: |
          uv tool install "genbadge[coverage]"
          uv run genbadge coverage -i coverage/coverage.xml -o coverage/coverage-badge.svg
      - name: Use the failed badge if coverage creation failed
        if: ${{ failure() }}
        run: |
          mkdir -p coverage/htmlcov
          cp .github/assets/coverage_failed.svg coverage/coverage-badge.svg
      - name: Pack functional coverage results
        run: |
          zip -FSr coverage-functional.zip coverage/coverage-badge.svg coverage/htmlcov coverage/coverage.xml
          mv coverage-functional.zip coverage
      - name: Download the other jobs' published site pieces
        # Each workflow publishes one slice of the site and pulls the others back down. A slice
        # can legitimately be missing (a fresh repository, or a deploy that has not propagated),
        # and it can be stale garbage (a bare curl once saved GitHub's 404 page under the .zip
        # name and republished it). -f drops the first case; the archive test drops the second,
        # and because a rejected file is never moved into the upload, publishing it again is how
        # the bad copy leaves the site.
        run: |
          for name in coverage-examples documentation; do
            if ! curl -fsSL --remove-on-error "https://gwtransport.github.io/pipetransport/$name.zip" -o "$name.zip"; then
              echo "::notice::$name.zip is not published yet; skipping"
              continue
            fi
            if unzip -tq "$name.zip"; then
              unzip -o "$name.zip"
              mv "$name.zip" coverage
            else
              echo "::warning::$name.zip is not a valid archive; dropping it from this upload"
              rm -f "$name.zip"
            fi
          done
      - name: Upload both coverage results
        if: ${{ always() }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: coverage

  deploy:
    if: ${{ github.ref == 'refs/heads/main' && always() }}
    needs: [test-minimum, test-latest]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
