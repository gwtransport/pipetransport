name: Build and Deploy Documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # Serialised on main: each site workflow rebuilds the Pages site from the live one, so
  # overlapping runs drop each other's slices.
  group: ${{ github.ref == 'refs/heads/main' && 'github-pages-site' || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: false

jobs:
  build-documentation:
    runs-on: ubuntu-latest
    steps:
      - name: Disable man-db to speed up pandoc install
        run: |
          echo 'set man-db/auto-update false' | sudo debconf-communicate >/dev/null
          sudo dpkg-reconfigure man-db
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # hatch-vcs needs the tag history to derive the version
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Set up Python
        run: uv python install
      - name: Install the project
        run: uv sync --extra test
      - name: Run inline examples that are part of the documentation
        run: uv run pytest tests/docs
      - name: Install Pandoc
        uses: pandoc/actions/setup@v1
      - name: Build documentation with sphinx and uv
        run: |
          uv tool run --from sphinx --with-editable ".[docs]" sphinx-build -j auto -b html docs/source docs/build/html
      - name: Publish the pipetransport wheel into the docs site
        # The interactive (JupyterLite/Pyodide) examples install pipetransport from this wheel via
        # micropip, so the in-browser code runs the exact version the docs were built from.
        run: |
          uv build --wheel --out-dir dist
          mkdir -p docs/build/html/_static/wheels
          cp dist/pipetransport-*-py3-none-any.whl docs/build/html/_static/wheels/
      - name: Zip documentation
        run: |
          mv docs/build/html coverage
          zip -FSr documentation.zip coverage
          mv documentation.zip coverage
      - name: Download the other jobs' published site pieces
        # Each workflow publishes one slice of the site and pulls the others back down. A slice
        # can legitimately be missing (a fresh repository, or a deploy that has not propagated),
        # and it can be stale garbage (a bare curl once saved GitHub's 404 page under the .zip
        # name and republished it). -f drops the first case; the archive test drops the second,
        # and because a rejected file is never moved into the upload, publishing it again is how
        # the bad copy leaves the site.
        run: |
          for name in coverage-functional coverage-examples; do
            if ! curl -fsSL --remove-on-error "https://gwtransport.github.io/pipetransport/$name.zip" -o "$name.zip"; then
              echo "::notice::$name.zip is not published yet; skipping"
              continue
            fi
            if unzip -tq "$name.zip"; then
              unzip -o "$name.zip"
              mv "$name.zip" coverage
            else
              echo "::warning::$name.zip is not a valid archive; dropping it from this upload"
              rm -f "$name.zip"
            fi
          done
      - name: Upload both coverage results
        uses: actions/upload-pages-artifact@v5
        with:
          path: coverage

  check-documentation-links:
    runs-on: ubuntu-latest
    needs: build-documentation
    steps:
      - name: Disable man-db to speed up pandoc install
        run: |
          echo 'set man-db/auto-update false' | sudo debconf-communicate >/dev/null
          sudo dpkg-reconfigure man-db
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # hatch-vcs needs the tag history to derive the version
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install Pandoc
        uses: pandoc/actions/setup@v1
      - name: Check documentation links
        run: |
          uv tool run --from sphinx --with-editable ".[docs]" sphinx-build -j auto -b linkcheck docs/source docs/build/linkcheck
      - name: Check links in README.md, pyproject.toml, and FUNDING.yml
        uses: lycheeverse/lychee-action@v2
        with:
          # Exclude the coverage badge + htmlcov report: deploy-time artifacts that 404 until the
          # coverage deploy publishes them (also listed in .lycheeignore for local runs).
          args: --verbose --no-progress --exclude 'pipetransport\.github\.io/pipetransport/(coverage-badge\.svg|htmlcov)' README.md pyproject.toml .github/FUNDING.yml

  deploy-documentation:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: build-documentation
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
